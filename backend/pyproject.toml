[tool.ruff]
target-version = "py312"
# 100 was too tight for the natural-language content this project stores
# (safety rules, template descriptions, welcome messages) — 120 avoids
# force-wrapping prose mid-sentence while still catching genuinely
# unwieldy code lines.
line-length = 120
src = ["app", "tests"]
# Auto-generated by `alembic revision`; not hand-written, not covered by
# the app/tests style rules above.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in argument default) is standard, required FastAPI
# style for Depends()/Path()/etc. in route and dependency signatures.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
