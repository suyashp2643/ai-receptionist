<body>
  <h1>Sunrise Realty Group</h1>

    This is a plain demo host page used only to verify the AI Receptionist embeddable widget

    src="../dist/widget.js"
    data-receptionist-id="REPLACE_WITH_YOUR_WIDGET_PUBLIC_ID"
    data-api-base-url="http://localhost:8000"
    async
  ></script>
